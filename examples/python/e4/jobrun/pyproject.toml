[project]
name = "jobrun"
dynamic = ["version"]
description = "Run typed plugin jobs concurrently, each with a deadline"
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.scripts]
jobrun = "jobrun.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/jobrun/__init__.py"

[dependency-groups]
dev = ["pytest", "mypy", "pyright"]

[tool.mypy]
python_version = "3.15"

[tool.pyright]
pythonVersion = "3.15"

[tool.pytest.ini_options]
filterwarnings = ["error"]
