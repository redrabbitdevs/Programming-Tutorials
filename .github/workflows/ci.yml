name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # JavaScript examples run on the exact Node the lessons teach (research/javascript/facts.md).
      # Install it first and record its path; the next setup-node puts Node 22 ahead of it on PATH
      # for the site build, so only the examples use Node 26.
      - uses: actions/setup-node@v4
        with:
          node-version: 26.11.1
      - name: Record Node 26 path
        run: echo "NODE=$(which node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # setup-python's manifest can lag new releases; uv ships CPython builds the day they're out.
      - uses: astral-sh/setup-uv@v6
      # Pin the exact patch release: version-printing examples record 3.15.0, and an
      # unpinned '3.15' silently moved to 3.15.2 and broke them.
      - name: Install Python 3.15.0
        run: uv python install 3.15.0
      # TypeScript examples are type-checked with the pinned tsc in tools/ts (7.0.2) and run by Node 26.
      # The compiler ships as optional per-platform packages and has no install script.
      - name: Install TypeScript compiler
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/ts
          echo "TSC=$PWD/tools/ts/node_modules/.bin/tsc" >> "$GITHUB_ENV"
      - name: Validate
        run: |
          export PYTHON="$(uv python find 3.15.0)"
          "$PYTHON" --version
          "$NODE" --version
          scripts/validate.sh
