name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # setup-python's manifest can lag new releases; uv ships CPython builds the day they're out.
      - uses: astral-sh/setup-uv@v6
      - name: Install Python 3.15
        run: uv python install 3.15
      - name: Validate
        run: |
          export PYTHON="$(uv python find 3.15)"
          "$PYTHON" --version
          scripts/validate.sh
